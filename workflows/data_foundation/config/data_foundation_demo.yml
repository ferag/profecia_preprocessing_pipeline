release:
  id: profecia_inputs_demo_v0
  base_dir: resources/data_releases/profecia_inputs_demo_v0
  status: demo-expanded
  start_year: 1982
  end_year: 1982
  temporal_resolution: monthly
  target_grid:
    name: global_0p5deg
    resolution: 0.5deg
    latitude: "89.5:-90.0"
    longitude: "-180.0:179.5"
    crs: EPSG:4326

provenance_inputs:
  - id: original_script_preprocess_co2_annual
    role: original_script
    path: /srv/read_only_data/NANA/scripts/current/preprocess_co2_annual.py
    copy_policy: copy
    license_or_terms: Internal PROFECIA preprocessing script; include for reproducibility.
    used_by: [derived_human/co2]
  - id: original_script_preprocess_ndep
    role: original_script
    path: /srv/read_only_data/NANA/scripts/current/preprocess_ndep.py
    copy_policy: copy
    license_or_terms: Internal PROFECIA preprocessing script; include for reproducibility.
    used_by: [ndep_tian2022/ndep]
  - id: original_script_preprocess_hfp
    role: original_script
    path: /srv/read_only_data/NANA/scripts/current/preprocess_hfp_0p5.py
    copy_policy: copy
    license_or_terms: Internal PROFECIA preprocessing script; include for reproducibility.
    used_by: [hfp_mu_hengl/hfp]
  - id: original_script_preprocess_soil
    role: original_script
    path: /srv/read_only_data/NANA/scripts/current/preprocess_soil_0p5.py
    copy_policy: copy
    license_or_terms: Internal PROFECIA preprocessing script; include for reproducibility.
    used_by: [hwsd2/sand, hwsd2/clay, hwsd2/silt, hwsd2/ph, hwsd2/soc, hwsd2/total_n, hwsd2/bulk, hwsd2/cec]
  - id: original_script_preprocess_grazing
    role: original_script
    path: /srv/read_only_data/NANA/scripts/current/preprocess_grazing_annual.py
    copy_policy: copy
    license_or_terms: Internal PROFECIA preprocessing script; include for reproducibility.
    used_by: [local_annual/tlu]
  - id: target_grid_lai_annual
    role: target_grid
    path: /srv/read_only_data/final_datasets/annual/lai_1982_2022_annual_0.5deg.nc
    copy_policy: reference
    license_or_terms: Canonical PROFECIA LAI target grid; referenced, not copied.
    used_by: [ndep_tian2022/ndep, hfp_mu_hengl/hfp, local_annual/tlu, hwsd2/sand, hwsd2/clay, hwsd2/silt, hwsd2/ph, hwsd2/soc, hwsd2/total_n, hwsd2/bulk, hwsd2/cec]
  - id: co2_ct2022_level1
    role: raw_input
    path: /srv/read_only_data/raw/co2/co2_2000_2021_monthly_0.5deg_level1.nc
    copy_policy: reference
    license_or_terms: CarbonTracker CT2022 source input; governed by original provider terms.
    used_by: [derived_human/co2]
  - id: co2_noaa_gml_csv
    role: raw_input
    path: /srv/read_only_data/NANA/human/RAW/co2/co2_mm_gl.csv
    copy_policy: reference
    license_or_terms: NOAA GML global mean CO2 CSV; governed by original provider terms.
    used_by: [derived_human/co2]
  - id: ndep_nhx
    role: raw_input
    path: /srv/read_only_data/NANA/human/RAW/N/ndep_nhx.nc
    copy_policy: reference
    license_or_terms: Tian et al. nitrogen deposition component; governed by original provider terms.
    used_by: [ndep_tian2022/ndep]
  - id: ndep_noy
    role: raw_input
    path: /srv/read_only_data/NANA/human/RAW/N/ndep_noy.nc
    copy_policy: reference
    license_or_terms: Tian et al. nitrogen deposition component; governed by original provider terms.
    used_by: [ndep_tian2022/ndep]
  - id: hfp_canonical_annual
    role: canonical_reference
    path: /srv/read_only_data/final_datasets/annual/human/hfp_1982_2022_annual_0.5deg.nc
    copy_policy: reference
    license_or_terms: Canonical PROFECIA final human footprint product; referenced, not copied.
    used_by: [hfp_mu_hengl/hfp]
  - id: hwsd2_bil
    role: raw_input
    path: /srv/read_only_data/NANA/soil/RAW/HWSD2_soil/RAW/HWSD2_RASTER/HWSD2.bil
    copy_policy: reference
    license_or_terms: HWSD2 raster input; governed by original provider terms.
    used_by: [hwsd2/sand, hwsd2/clay, hwsd2/silt, hwsd2/ph, hwsd2/soc, hwsd2/total_n, hwsd2/bulk, hwsd2/cec]
  - id: hwsd2_layers_csv
    role: raw_input
    path: /srv/read_only_data/NANA/soil/RAW/HWSD2_soil/RAW/HWSD2_LAYERS.csv
    copy_policy: reference
    license_or_terms: HWSD2 layer attribute table; governed by original provider terms.
    used_by: [hwsd2/sand, hwsd2/clay, hwsd2/silt, hwsd2/ph, hwsd2/soc, hwsd2/total_n, hwsd2/bulk, hwsd2/cec]
  - id: livestockmap_archive
    role: raw_input
    path: /srv/read_only_data/NANA/human/RAW/Grazing/RAW/LivestockMap.zip
    copy_policy: reference
    license_or_terms: LivestockMap source rasters; referenced, not copied.
    used_by: [local_annual/tlu]
  - id: tlu_canonical_annual
    role: canonical_reference
    path: /srv/read_only_data/final_datasets/annual/human/tlu_1982_2022_annual_0.5deg.nc
    copy_policy: reference
    license_or_terms: Canonical PROFECIA final TLU product; referenced, not copied.
    used_by: [local_annual/tlu]

