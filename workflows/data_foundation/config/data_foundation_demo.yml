  annual/co2: /srv/read_only_data/final_datasets/annual/human/co2_1982_2022_annual_0.5deg.nc
  annual/tlu: /srv/read_only_data/final_datasets/annual/human/tlu_1982_2022_annual_0.5deg.nc
  monthly/spei06_univariable: /srv/read_only_data/final_datasets/monthly/spei06_univariable_1982_2022_monthly_0.5deg.nc
  monthly/bulk: /srv/read_only_data/final_datasets/monthly/soil/bulk_1982_2022_monthly_0.5deg.nc
  monthly/cec: /srv/read_only_data/final_datasets/monthly/soil/cec_1982_2022_monthly_0.5deg.nc
  monthly/clay: /srv/read_only_data/final_datasets/monthly/soil/clay_1982_2022_monthly_0.5deg.nc
  monthly/elevation: /srv/read_only_data/final_datasets/monthly/soil/elevation_1982_2022_monthly_0.5deg.nc
  monthly/ph: /srv/read_only_data/final_datasets/monthly/soil/ph_1982_2022_monthly_0.5deg.nc
  monthly/richness: /srv/read_only_data/final_datasets/monthly/soil/richness_1982_2022_monthly_0.5deg.nc
  monthly/sand: /srv/read_only_data/final_datasets/monthly/soil/sand_1982_2022_monthly_0.5deg.nc
  monthly/silt: /srv/read_only_data/final_datasets/monthly/soil/silt_1982_2022_monthly_0.5deg.nc
  monthly/soc: /srv/read_only_data/final_datasets/monthly/soil/soc_1982_2022_monthly_0.5deg.nc
  monthly/total_n: /srv/read_only_data/final_datasets/monthly/soil/total_n_1982_2022_monthly_0.5deg.nc

selected_variables:
  - source: era5_single_levels
    variable: t2m
  - source: era5_single_levels
    variable: d2m
  - source: era5_single_levels
    variable: tp
  - source: era5_single_levels
    variable: pev
  - source: era5_single_levels
    variable: ssrd
  - source: era5_single_levels
    variable: swvl1
  - source: era5_single_levels
    variable: swvl2
  - source: era5_single_levels
    variable: swvl3
  - source: era5_single_levels
    variable: tcc
  - source: era5_single_levels
    variable: u10
  - source: era5_single_levels
    variable: v10

sources:
  era5_single_levels:
    provider: ECMWF / Copernicus Climate Data Store
    source_family: ERA5 single-level monthly means
    access_mode: api
    access_protocol: cdsapi
    dataset: reanalysis-era5-single-levels-monthly-means
    product_type: monthly_averaged_reanalysis
    adapter: era5
    requires_authentication: true
    variables:
      t2m:
        cds_name: 2m_temperature
        long_name: 2 metre temperature
        role: predictor
        source_units: K
        expected_min: 180
        expected_max: 330
        years: &demo_years ["1982"]
        months: &all_months ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
        time: &monthly_time ["00:00"]
        data_format: netcdf
        download_format: unarchived
        output_filename: t2m_1982_monthly_raw.nc
      d2m:
        cds_name: 2m_dewpoint_temperature
        long_name: 2 metre dewpoint temperature
        role: predictor
        source_units: K
        expected_min: 180
        expected_max: 330
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: d2m_1982_monthly_raw.nc
      tp:
        cds_name: total_precipitation
        long_name: Total precipitation
        role: predictor
        source_units: m
        expected_min: 0
        expected_max: 2
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: tp_1982_monthly_raw.nc
      pev:
        cds_name: potential_evaporation
        long_name: Potential evaporation
        role: predictor
        source_units: m
        expected_min: -2
        expected_max: 2
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: pev_1982_monthly_raw.nc
      ssrd:
        cds_name: surface_solar_radiation_downwards
        long_name: Surface solar radiation downwards
        role: predictor
        source_units: J m**-2
        expected_min: 0
        expected_max: 400000000
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: ssrd_1982_monthly_raw.nc
      swvl1:
        cds_name: volumetric_soil_water_layer_1
        long_name: Volumetric soil water layer 1
        role: predictor
        source_units: m**3 m**-3
        expected_min: 0
        expected_max: 1
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: swvl1_1982_monthly_raw.nc
      swvl2:
        cds_name: volumetric_soil_water_layer_2
        long_name: Volumetric soil water layer 2
        role: predictor
        source_units: m**3 m**-3
        expected_min: 0
        expected_max: 1
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: swvl2_1982_monthly_raw.nc
      swvl3:
        cds_name: volumetric_soil_water_layer_3
        long_name: Volumetric soil water layer 3
        role: predictor
        source_units: m**3 m**-3
        expected_min: 0
        expected_max: 1
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: swvl3_1982_monthly_raw.nc
      tcc:
        cds_name: total_cloud_cover
        long_name: Total cloud cover
        role: predictor
        source_units: "0-1"
        expected_min: 0
        expected_max: 1
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: tcc_1982_monthly_raw.nc
      u10:
        cds_name: 10m_u_component_of_wind
        long_name: 10 metre U wind component
        role: predictor
        source_units: m s**-1
        expected_min: -100
        expected_max: 100
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: u10_1982_monthly_raw.nc
      v10:
        cds_name: 10m_v_component_of_wind
        long_name: 10 metre V wind component
        role: predictor
        source_units: m s**-1
        expected_min: -100
        expected_max: 100
        years: *demo_years
        months: *all_months
        time: *monthly_time
        data_format: netcdf
        download_format: unarchived
        output_filename: v10_1982_monthly_raw.nc

  geov2_lai:
    provider: THEIA
    source_family: GEOV2 / GEOV2-GCM AVHRR LAI
    access_mode: manual
    access_protocol: manual_local_input
    adapter: lai_geov2
    requires_authentication: false
    raw_input_dir: data/manual/GEOV2_GCM_LAI/
    instructions: >
      GEOV2 or GEOV2-GCM AVHRR LAI files must be downloaded manually and placed in
      data/manual/GEOV2_GCM_LAI/. This prototype only registers and validates
      manually available files; it does not download LAI automatically.
    variables:
      lai:
        long_name: Leaf Area Index
        role: target
        source_units: m2 m-2
        native_format: h5.gz
        native_temporal_resolution: 10-day composites
        expected_patterns:
          - THEIA_GEOV2_R01_AVHRR_LAI_*.h5
          - THEIA_GEOV2_R01_AVHRR_LAI_*.h5.gz
          - THEIA_GEOV2_R02_AVHRR_LAI_*.h5
          - THEIA_GEOV2_R02_AVHRR_LAI_*.h5.gz
          - THEIA_GEOV2-GCM_R01_AVHRR_LAI_*.h5
          - THEIA_GEOV2-GCM_R01_AVHRR_LAI_*.h5.gz
          - THEIA_GEOV2-GCM_R02_AVHRR_LAI_*.h5
          - THEIA_GEOV2-GCM_R02_AVHRR_LAI_*.h5.gz
        processed_demo_output_filename: lai_manual_input_inventory.json

  carbontracker_co2:
    provider: NOAA Global Monitoring Laboratory
    source_family: CarbonTracker CT2022 + NOAA GML global mean CO2
    access_mode: http
    access_protocol: https
    adapter: co2
    requires_authentication: false
    carbontracker:
      role: spatial_co2_fields
      product: co2_total_monthly
      base_url: https://gml.noaa.gov/aftp/products/carbontracker/co2/CT2022/molefractions/co2_total_monthly/
      filename_pattern: CT2022.molefrac_glb3x2_{year}-{month}.nc
      start_year: 2000
      end_year: 2020
      months: *all_months
      native_grid: global 3x2 degree
      format: NetCDF
      variable_description: atmospheric CO2 mole fraction field
      keep_monthly_files: false
    noaa_gml_global_mean:
      role: temporal_extension_or_offset
      url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_gl.csv
      format: CSV
      spatial: false
      description: globally averaged marine surface monthly mean CO2
    notes:
      - CarbonTracker CT2022 provides the spatial CO2 fields.
      - NOAA GML global mean CO2 is not spatial; it is used to extend or offset the CarbonTracker maps for years not covered by the spatial product.
      - Existing preprocessing logic combines both sources with a monthly average offset method.
    variables:
      co2:
        long_name: Atmospheric CO2 concentration
        category: Human
        dimensionality: 3D dynamic
        anomaly: true
        transform: Per-pixel detrended anomaly
        role: predictor
        source_units: ppm
        description: Atmospheric CO2 concentration — fertilisation effect
        native_variable: co2
        output_filename: co2_2000_2020_monthly_glb3x2.nc

  ndep_tian2022:
    provider: Tian et al. 2022 (PANGAEA)
    source_family: HaNi anthropogenic nitrogen deposition
    access_mode: http
    access_protocol: https
    adapter: ndep
    requires_authentication: false
    doi: 10.1594/PANGAEA.942069
    landing_page: https://doi.pangaea.de/10.1594/PANGAEA.942069
    source_start_year: 1860
    source_end_year: 2019
    native_units: g N per cell yr-1
    components:
      nhx:
        role: NHx-N deposition
        url: https://download.pangaea.de/dataset/942069/files/ndep_nhx.zip
        filename: ndep_nhx.nc
        variable: ndep_nhx
      noy:
        role: NOy-N deposition
        url: https://download.pangaea.de/dataset/942069/files/ndep_noy.zip
        filename: ndep_noy.nc
        variable: ndep_noy
    notes:
      - HaNi covers 1860-2019; PROFECIA may require 1982-2022.
      - ndep is computed as ndep_nhx + ndep_noy.
      - Missing target years after the source period are extrapolated with per-pixel OLS following the existing prototype script.
    variables:
      ndep:
        long_name: Nitrogen deposition
        category: Human
        dimensionality: 3D dynamic
        anomaly: true
        transform: Per-pixel detrended anomaly
        role: predictor
        source_units: g N m-2 yr-1
        description: Nitrogen deposition — nutrient addition driving productivity change
        canonical_reference_path: /srv/read_only_data/final_datasets/annual/human/ndep_1982_2022_annual_0.5deg.nc
        start_year: 1982
        end_year: 2022
        coarsen_factor: 6
        extrapolation:
          method: per_pixel_ols
          ols_start_year: 2015
          clip_to_historical_max_factor: 1.5
        output_filename: ndep_1982_2022_annual_0.5deg.nc

  hfp_mu_hengl:
    provider: Mu 2022 + Hengl 2022 (bias-corrected)
    source_family: Human footprint
    access_mode: http
    access_protocol: https
    adapter: hfp
    requires_authentication: false
    target_grid:
      resolution_degrees: 0.5
      west: -180.0
      north: 90.0
      n_lat: 360
      n_lon: 720
      crs: EPSG:4326
    mu_figshare:
      role: observed_annual_maps
      article: "Mu et al. (2022): A global record of annual terrestrial Human Footprint dataset from 2000 to 2018"
      article_url: https://www.nature.com/articles/s41597-022-01284-8
      doi: 10.6084/m9.figshare.16571064
      landing_page: https://figshare.com/articles/figure/An_annual_global_terrestrial_Human_Footprint_dataset_from_2000_to_2018/16571064
      api_url: https://api.figshare.com/v2/articles/16571064
      verified_start_year: 2000
      verified_end_year: 2018
      expected_zip_pattern: hfp{year}.zip
    hengl_zenodo:
      role: extrapolated_early_year_maps
      doi: 10.5281/zenodo.6636562
      landing_page: https://zenodo.org/records/6636562
      start_year: 1982
      end_year: 1999
      url_pattern: https://zenodo.org/records/6636562/files/hfootprint_{year}_1km.tif?download=1
      year_2000_url: https://zenodo.org/records/6636562/files/hfp2000.tif?download=1
    notes:
      - Figshare API is used to list Mu et al. files and download_url values; HTML scraping is not used.
      - The article verifies 2000-2018, but the adapter records currently available Figshare years in request.json before download.
      - Hengl 2022 provides extrapolated earlier-year maps for 1982-1999.
    variables:
      hfp:
        long_name: Human footprint index
        category: Human
        dimensionality: 3D dynamic
        anomaly: true
        transform: Per-pixel detrended anomaly
        role: predictor
        source_units: index
        description: Human footprint index — composite of built environment, population, roads, lights, croplands, and pasture
        canonical_reference_path: /srv/read_only_data/final_datasets/annual/human/hfp_1982_2022_annual_0.5deg.nc
        start_year: 1982
        end_year: 2022
        output_filename: hfp_1982_2022_annual_0.5deg.nc

  livestockmap:
    provider: "FAO-derived / internal or manually provided LivestockMap"
    source_family: "Annual livestock density maps"
    access_mode: manual_or_internal
    access_protocol: local_file
    adapter: livestockmap
    requires_authentication: false
    public_source_verified: false
    notes:
      - "A public directly downloadable LivestockMap annual 1961-2021 source has not been verified."
      - "Treat LivestockMap.zip as a manually provided or internally stored derived dataset."
      - "The raw archive should contain annual livestock density rasters by species and year."
      - "Optional future reconstruction could combine FAOSTAT national time series with GLW spatial templates, but this is not implemented here."
    raw_archive:
      expected_path: data/manual/LivestockMap/LivestockMap.zip
    expected_period:
      start_year: 1961
      end_year: 2021
    profecia_target_period:
      start_year: 1982
      end_year: 2022
    temporal_extension:
      source_available_until: 2021
      target_required_until: 2022
      extension_policy: TODO_CONFIRM
      possible_policies:
        - hold_last_available_year
        - user_provided_2022
        - crop_to_2021
    species:
      cattle:
        weight: 1.0
        expected_patterns:
          - "*cattle*{year}*.tif"
          - "*Cattle*{year}*.tif"
      buffalo:
        weight: 1.0
        expected_patterns:
          - "*buffalo*{year}*.tif"
          - "*Buffalo*{year}*.tif"
      horse:
        weight: 0.8
        expected_patterns:
          - "*horse*{year}*.tif"
          - "*Horse*{year}*.tif"
      sheep:
        weight: 0.1
        expected_patterns:
          - "*sheep*{year}*.tif"
          - "*Sheep*{year}*.tif"
      goats:
        weight: 0.1
        expected_patterns:
          - "*goat*{year}*.tif"
          - "*Goat*{year}*.tif"
    variables:
      tlu:
        long_name: Tropical Livestock Units
        category: Human
        data_structure: 3D dynamic
        dimensionality: 3D dynamic
        anomaly: true
        role: predictor
        source_units: TLU/km²
        units: TLU/km²
        formula: "TLU = cattle + buffalo + 0.8 * horse + 0.1 * sheep + 0.1 * goats"
        transform: Per-pixel detrended anomaly
        target_value_type: per-pixel detrended anomaly
        description: Tropical Livestock Units — cattle + buffalo + 0.8 horse + 0.1 sheep + 0.1 goats

  hwsd2:
    provider: FAO / IIASA / ISRIC / JRC / CAS
    source_family: Harmonized World Soil Database v2.0
    access_mode: http
    access_protocol: direct_http
    adapter: hwsd2
    requires_authentication: false
    landing_page: https://www.fao.org/soils-portal/data-hub/soil-maps-and-databases/harmonized-world-soil-database-v20/en/
    native_spatial_resolution: 30 arc-second / approximately 1 km
    preprocessing_target: hwsd2_soil_0.5deg.nc
    canonical_reference_dir: /srv/read_only_data/final_datasets/monthly/soil
    canonical_reference_template: "{variable}_1982_2022_monthly_0.5deg.nc"
    preprocessing_script_reference: /srv/read_only_data/NANA/scripts/current/preprocess_soil_0p5.py
    verification_script_reference: /srv/read_only_data/NANA/scripts/current/verify_soil_outputs.py
    expected_processed_grid:
      latitude_size: 360
      longitude_size: 720
      resolution: 0.5deg
      latitude_range: "-90.0 to 89.5"
      longitude_range: "-180.0 to 179.5"
    expected_extracted_inputs:
      raster: HWSD2.bil
      layer_attributes: HWSD2_LAYERS.csv
    processing_notes:
      - "Download HWSD2_RASTER.zip and HWSD2_DB.zip once for the source, not once per variable."
      - "The current preprocessing script expects the ZIP contents to be extracted before processing."
      - "The provided preprocessing script currently uses the shallowest/topsoil HWSD2 layer, not a 0-100 cm aggregate."
      - "Expected derived variables: sand, clay, silt, ph, soc, total_n, bulk, cec."
      - "verify_soil_outputs.py expects soc and total_n in percent."
    data_files:
      database:
        url: https://s3.eu-west-1.amazonaws.com/data.gaezdev.aws.fao.org/HWSD/HWSD2_DB.zip
        filename: HWSD2_DB.zip
      raster:
