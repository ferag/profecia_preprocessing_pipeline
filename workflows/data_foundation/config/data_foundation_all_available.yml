  copy_policy: reference
  license_or_terms: THEIA GEOV2-GCM AVHRR LAI source composites; referenced for reproducibility, not redistributed in the RO-Crate.
  used_by: [local_lai/lai]
  description: Local directory of 10-day THEIA GEOV2-GCM AVHRR LAI H5.GZ composites. The workflow converts digital numbers to physical LAI using LAI = DN / 30, masks invalid DN values outside [0, 210], and computes monthly means on the PROFECIA 0.5 degree grid.
