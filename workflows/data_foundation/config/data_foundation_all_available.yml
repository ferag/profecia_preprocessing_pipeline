derived_products:
- id: swvl1-2
  source: derived_soil_water
  variable: swvl1-2
  long_name: Volumetric soil water layer 1-2 weighted mean
  role: predictor
  source_units: m**3 m**-3
  units: m**3 m**-3
  temporal_resolution: monthly
  output_filename: swvl1-2_1982_2022_monthly_0.5deg.nc
  input_files:
  - monthly/era5_single_levels_swvl1_monthly_0.5deg.nc
  - monthly/era5_single_levels_swvl2_monthly_0.5deg.nc
  source_variables:
  - source: era5_single_levels
    variable: swvl1
  - source: era5_single_levels
    variable: swvl2
  formula: swvl1-2 = (swvl1 * 7 + swvl2 * 21) / 28
  weights: 'swvl1: 7/28; swvl2: 21/28'
  description: Weighted combination of swvl1 and swvl2. swvl1 represents the first
    7 cm and swvl2 the following 21 cm, yielding a weighted mean for the 0-28 cm layer.
  notebook_reference: /srv/volumes/ferag/profecia/notebooks/check_d_swvl_combined.ipynb
- id: vpd
  source: derived_climate
  variable: vpd
  long_name: Vapor Pressure Deficit
  source_units: kPa
  units: kPa
  output_filename: vpd_1982_2022_monthly_0.5deg.nc
  input_files:
  - monthly/era5_single_levels_t2m_monthly_0.5deg.nc
  - monthly/era5_single_levels_d2m_monthly_0.5deg.nc
  formula: VPD = es(T2M) - ea(D2M); Magnus-type equation
  description: Vapor pressure deficit computed from 2m temperature and 2m dewpoint
    temperature.
  role: predictor
  temporal_resolution: monthly
- id: subswc
  source: derived_soil_water
  variable: subswc
  long_name: Sub-surface Soil Water Content
  source_units: m**3 m**-3
  units: m**3 m**-3
  output_filename: subswc_1982_2022_monthly_0.5deg.nc
  input_files:
  - monthly/era5_single_levels_swvl2_monthly_0.5deg.nc
  - monthly/era5_single_levels_swvl3_monthly_0.5deg.nc
  formula: subswc = (swvl2 * 21 + swvl3 * 72) / 93
  description: Weighted subsurface soil water content from ERA5 soil water layers
    2 and 3.
  role: predictor
  temporal_resolution: monthly
