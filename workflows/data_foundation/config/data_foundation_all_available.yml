release:
  id: profecia_inputs_all_available_v0
  base_dir: resources/data_releases/profecia_inputs_all_available_v0
  status: all-available-general-ro-crate
  start_year: 1982
  end_year: 2022
  temporal_resolution: monthly
  target_grid:
    name: global_0p5deg
    resolution: 0.5deg
    latitude: 89.5:-90.0
    longitude: -180.0:179.5
    crs: EPSG:4326
provenance_inputs:
- id: original_script_preprocess_co2_annual
  role: original_script
  path: workflows/data_foundation/workflow/scripts/legacy/preprocess_co2_annual.py
  copy_policy: copy
  license_or_terms: Internal PROFECIA preprocessing script; include for reproducibility.
  used_by: [derived_human/co2]
- id: original_script_preprocess_ndep
  role: original_script
  path: workflows/data_foundation/workflow/scripts/legacy/preprocess_ndep.py
